name: 'Find Jira Issue'
description: 'Find Jira Issue'
inputs:
  token:
    description: "Token to connect to Jira"
    required: true
  jql:
    description: "JQL query to run"
    required: true
  fields:
    description: "Comma-separated list of fields to return for each issue"
  max-results:
    description: "Maximum number of issues to return"
    default: "50"
  api-base:
    description: "Base URL for the Jira API"
    default: "https://jira.mongodb.org"
outputs:
  found:
    description: "returns 'true' if issue is found otherwise 'false'"
    value: ${{ steps.find.outputs.FOUND }}
  issue-key:
    description: "key of the issue found"
    value: ${{ steps.find.outputs.KEY }}
  issues:
    description: "JSON array of all issues found"
    value: ${{ steps.find.outputs.ISSUES }}
runs:
  using: "composite"
  steps:
    - id: request
      shell: bash
      env:
        QUERY: ${{ inputs.jql }}
        FIELDS: ${{ inputs.fields }}
        MAX_RESULTS: ${{ inputs.max-results }}
      run: |
        {
          echo "REQUEST_BODY<<EOF"
          if [[ -n "$FIELDS" ]]; then
            jq -n --arg query "$QUERY" --arg fields "$FIELDS" --argjson max "$MAX_RESULTS" \
              '{jql: $query, fields: ($fields | split(",")), maxResults: $max}'
          else
            jq -n --arg query "$QUERY" --argjson max "$MAX_RESULTS" \
              '{jql: $query, maxResults: $max}'
          fi
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - id: find
      shell: bash
      env:
        JIRA_API_TOKEN: ${{ inputs.token }}
        JIRA_API_BASE: ${{ inputs.api-base }}
        REQUEST_BODY: ${{ steps.request.outputs.REQUEST_BODY }}
      run: |
        json_response=$(curl --fail --request POST \
          --url "${JIRA_API_BASE}/rest/api/2/search" \
          --header 'Authorization: Bearer '"${JIRA_API_TOKEN}" \
          --header 'Accept: application/json' \
          --header 'Content-Type: application/json' \
          --data "$REQUEST_BODY")
        {
          echo "ISSUES<<EOF"
          echo "${json_response}" | jq -c '.issues'
          echo "EOF"
          echo "KEY=$(echo "${json_response}" | jq -r '.issues[0].key // ""')"
          echo "FOUND=$(echo "${json_response}" | jq -r '[.issues[]] | any')"
        } >> "$GITHUB_OUTPUT"
