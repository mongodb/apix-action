name: 'Create Jira Version'
description: 'Create a Jira project version (fix version). Fails if a version with the given name already exists.'
inputs:
  token:
    description: "Token to connect to Jira"
    required: true
  project-key:
    description: "Project key that owns the version"
    required: true
  name:
    description: "Version name to create"
    required: true
  api-base:
    description: "Base URL for the Jira API"
    default: "https://jira.mongodb.org"
outputs:
  version-id:
    description: "Id of the newly created version"
    value: ${{ steps.create.outputs.VERSION_ID }}
runs:
  using: "composite"
  steps:
    - id: create
      shell: bash
      env:
        JIRA_API_BASE: ${{ inputs.api-base }}
        JIRA_API_TOKEN: ${{ inputs.token }}
        PROJECT_KEY: ${{ inputs.project-key }}
        NAME: ${{ inputs.name }}
      run: |
        set -Eeou pipefail
        body=$(jq -n --arg name "${NAME}" '{name:$name}')
        response=$(curl --fail --silent --show-error \
          --request POST \
          --url "${JIRA_API_BASE}/rest/api/2/project/${PROJECT_KEY}/versions" \
          --header 'Authorization: Bearer '"${JIRA_API_TOKEN}" \
          --header 'Accept: application/json' \
          --header 'Content-Type: application/json' \
          --data "$body")
        echo "VERSION_ID=$(printf '%s' "${response}" | jq -r '.id')" >> "$GITHUB_OUTPUT"
