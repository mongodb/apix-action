name: Sync Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  sync-test:
    name: Test Sync
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path sync/Cargo.toml --check

      - name: Lint
        run: cargo clippy --manifest-path sync/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path sync/Cargo.toml
