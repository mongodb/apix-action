name: Create Jira Ticket for New Issues

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  create-jira:
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/_issue-opened.yaml
    secrets:
      op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
