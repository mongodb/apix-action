name: Reopen Jira Ticket on Issue Reopen

on:
  issues:
    types: [reopened]

permissions: {}

jobs:
  reopen-jira:
    permissions:
      contents: read
      issues: read
    uses: ./.github/workflows/_issue-reopened.yaml
    secrets:
      op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
