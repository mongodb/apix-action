name: Create Jira Ticket for Dependabot PRs

on:
  pull_request:
    types: [opened]

permissions: {}

jobs:
  create-jira:
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    uses: mongodb/apix-action/.github/workflows/_dependabot-jira.yaml@9ce9e6205a14af111352430e9f9adbea1c75230b # main
    secrets: inherit
