# sync -> mongodb/atlas-local-lib
# sync -> mongodb/atlas-local-cli
# sync -> mongodb-js/atlas-local-lib-js
# sync -> mongodb/atlas-local-lib-py
# sync -> mongodb/mongodb-atlas-cli

name: Dependabot PR automation

on:
  pull_request:
    # `synchronize` covers Dependabot rebases and recreates, which rewrite the PR
    # branch without opening a new PR.
    types: [opened, synchronize]

permissions: {}

jobs:
  dependabot:
    # Keyed on the PR author, not the actor: apix-bot's own post-update commit re-triggers
    # this workflow, and that run is the one that approves. The author stays dependabot[bot],
    # so this ignores the sync PRs apix-bot opens, which an actor check would match.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    uses: ./.github/workflows/_dependabot-jira.yaml
    secrets: inherit
