# sync -> mongodb/atlas-local-cli
# sync -> mongodb-js/atlas-local-lib-js
# sync -> mongodb/atlas-local-lib-py

name: Auto Close Jira

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  close-jira:
    if: contains(github.event.pull_request.labels.*.name, 'auto_close_jira')
    permissions:
      contents: read
      pull-requests: read
    uses: mongodb/apix-action/.github/workflows/_close-jira.yaml@002b807a2bdd00bd5ad222e363352851e17fdfd7 # main
    secrets: inherit
