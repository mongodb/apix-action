name: Auto Close Jira

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  close-jira:
    if: contains(github.event.pull_request.labels.*.name, 'auto_close_jira')
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/_close-jira.yaml
    secrets:
      op_service_account_token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
