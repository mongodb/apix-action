# sync -> mongodb/atlas-local-cli
# sync -> mongodb-js/atlas-local-lib-js
# sync -> mongodb/atlas-local-lib-py

name: Auto Close Jira

on:
  pull_request:
    types: [closed]

permissions: {}

jobs:
  close-jira:
    if: contains(github.event.pull_request.labels.*.name, 'auto_close_jira')
    permissions:
      contents: read
      pull-requests: read
    uses: mongodb/apix-action/.github/workflows/_close-jira.yaml@5cedcea33c4925777e1a7e8646d87ac8593562d8 # main
    secrets: inherit
