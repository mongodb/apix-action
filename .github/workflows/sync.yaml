name: Sync workflows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sync binary
    runs-on: ubuntu-latest
    outputs:
      owners: ${{ steps.owners.outputs.owners }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        run: cargo install just --locked
      - name: Build
        run: just build
      - name: Find owners
        id: owners
        run: echo "owners=$(just owners)" >> "$GITHUB_OUTPUT"
      - name: Upload sync binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sync-binary
          path: bin/sync
  sync:
    name: Sync workflows to repositories
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        owner: ${{ fromJSON(needs.build.outputs.owners) }}
    steps:
      - name: Initialize PR results
        run: |
          printf '[]\n' > "sync-prs-${{ matrix.owner }}.json"
      - name: Set APIX bot token
        id: app-token
        uses: mongodb/apix-action/token@8549161120ce38b1e132ff833302a0ecbde58038
        with:
          app-id: ${{ secrets.APIXBOT_APP_ID }}
          private-key: ${{ secrets.APIXBOT_APP_PEM }}
          owner: ${{ matrix.owner }}
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Download sync binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sync-binary
          path: bin
      - name: Sync workflows
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SYNC_OWNER: ${{ matrix.owner }}
          SYNC_JSON_FILE: sync-prs-${{ matrix.owner }}.json
          WORKFLOW_DIRECTORY: .github/workflows
        run: |
          chmod +x bin/sync
          bin/sync --json > "$SYNC_JSON_FILE"
      - name: Upload created PRs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sync-prs-${{ matrix.owner }}
          path: sync-prs-${{ matrix.owner }}.json

  summary:
    name: Summarize created PRs
    if: ${{ always() && needs.build.result == 'success' }}
    needs: [build, sync]
    runs-on: ubuntu-latest
    steps:
      - name: Download sync binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sync-binary
          path: bin
      - name: Download created PRs
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sync-prs-*
          path: sync-prs
          merge-multiple: true
      - name: Make sync binary executable
        run: chmod +x bin/sync
      - name: Write summary
        run: bin/sync summary --directory sync-prs >> "$GITHUB_STEP_SUMMARY"
