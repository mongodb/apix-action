name: Sync workflows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sync binary
    runs-on: ubuntu-latest
    outputs:
      owners: ${{ steps.owners.outputs.owners }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        run: cargo install just --locked
      - name: Build
        run: just build
      - name: Find owners
        id: owners
        run: echo "owners=$(just owners)" >> "$GITHUB_OUTPUT"
      - name: Upload sync binary
        uses: actions/upload-artifact@v4
        with:
          name: sync-binary
          path: bin/sync
  sync:
    name: Sync workflows to repositories
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        owner: ${{ fromJSON(needs.build.outputs.owners) }}
    steps:
      - name: Set APIX bot token
        id: app-token
        uses: mongodb/apix-action/token@8549161120ce38b1e132ff833302a0ecbde58038
        with:
          app-id: ${{ secrets.APIXBOT_APP_ID }}
          private-key: ${{ secrets.APIXBOT_APP_PEM }}
          owner: ${{ matrix.owner }}
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install just
        run: cargo install just --locked
      - name: Download sync binary
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sync-binary
          path: bin
      - name: Sync workflows
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SYNC_OWNER: ${{ matrix.owner }}
          WORKFLOW_DIRECTORY: .github/workflows
        run: |
          chmod +x bin/sync
          just sync
