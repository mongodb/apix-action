name: Sync workflows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sync binary
    runs-on: ubuntu-latest
    outputs:
      owners: ${{ steps.owners.outputs.owners }}
    steps:
      # Local references are rewritten to the commit being synced. Dispatched from a
      # branch, that commit may never reach main, leaving every target pointing at a
      # permalink that dies with the branch.
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "sync must be dispatched from main, got ${{ github.ref }}" >&2
          exit 1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install just
        run: cargo install just --locked
      - name: Build
        run: just build
      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        id: load-secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_ID: "op://APIx/APIx Github Bot/App ID"
          APP_SECRET: "op://APIx/APIx Github Bot/App Secret"
      - id: decode-app-secret
        run: |
          {
            echo 'APP_PEM<<EOF'
            echo "${{ steps.load-secrets.outputs.APP_SECRET }}" | base64 -d | openssl pkey -inform DER -outform PEM
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Find owners
        id: owners
        env:
          APP_ID: ${{ steps.load-secrets.outputs.APP_ID }}
          APP_PRIVATE_KEY: ${{ steps.decode-app-secret.outputs.APP_PEM }}
        run: echo "owners=$(just owners)" >> "$GITHUB_OUTPUT"
      - name: Upload sync binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sync-binary
          path: bin/sync
  sync:
    name: Sync workflows to repositories
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        owner: ${{ fromJSON(needs.build.outputs.owners) }}
    steps:
      - name: Initialize PR results
        run: |
          printf '[]\n' > "sync-prs-${{ matrix.owner }}.json"
      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
        id: load-secrets
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          APP_ID: "op://APIx/APIx Github Bot/App ID"
          APP_SECRET: "op://APIx/APIx Github Bot/App Secret"
      - id: decode-app-secret
        run: |
          {
            echo 'APP_PEM<<EOF'
            echo "${{ steps.load-secrets.outputs.APP_SECRET }}" | base64 -d | openssl pkey -inform DER -outform PEM
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: Set APIX bot token
        id: app-token
        uses: mongodb/apix-action/token@f7d2400a387dea2661651b14bbaf8c8f46c8bf66 # v16
        with:
          app-id: ${{ steps.load-secrets.outputs.APP_ID }}
          private-key: ${{ steps.decode-app-secret.outputs.APP_PEM }}
          owner: ${{ matrix.owner }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
      - name: Download sync binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sync-binary
          path: bin
      - name: Sync workflows
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SYNC_OWNER: ${{ matrix.owner }}
          SYNC_JSON_FILE: sync-prs-${{ matrix.owner }}.json
          WORKFLOW_DIRECTORY: .github/workflows
        run: |
          chmod +x bin/sync
          bin/sync --json "$SYNC_JSON_FILE"
      - name: Upload created PRs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sync-prs-${{ matrix.owner }}
          path: sync-prs-${{ matrix.owner }}.json

  summary:
    name: Summarize created PRs
    if: ${{ always() && needs.build.result == 'success' }}
    needs: [build, sync]
    runs-on: ubuntu-latest
    steps:
      - name: Download sync binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sync-binary
          path: bin
      - name: Download created PRs
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sync-prs-*
          path: sync-prs
          merge-multiple: true
      - name: Make sync binary executable
        run: chmod +x bin/sync
      - name: Write summary
        run: bin/sync summary --directory sync-prs >> "$GITHUB_STEP_SUMMARY"
