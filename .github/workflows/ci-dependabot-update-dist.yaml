name: Update dist for dependabot prs

on:
  pull_request

jobs:
  update-dist:
    name: Update dist folders
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
    - uses: GitHubSecurityLab/actions-permissions/monitor@bf82d13b9b10051d224345ab9184f5ede0a94289 # v1
      with:
        config: ${{ vars.PERMISSIONS_CONFIG }}
    - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5
      id: load-secrets
      env:
        OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        APP_ID: "op://APIx/APIx Github Bot/App ID"
        APP_SECRET: "op://APIx/APIx Github Bot/App Secret"
    - id: decode-app-secret
      run: |
        {
          echo 'APP_PEM<<EOF'
          echo "${{ steps.load-secrets.outputs.APP_SECRET }}" | base64 -d | openssl pkey -inform DER -outform PEM
          echo EOF
        } >> "$GITHUB_OUTPUT"
    - name: Set Apix Bot token
      id: app-token
      uses: $/token
      with:
        app-id: ${{ steps.load-secrets.outputs.APP_ID }}
        private-key: ${{ steps.decode-app-secret.outputs.APP_PEM }}
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.head_ref }}
        token: ${{ steps.app-token.outputs.token }}
        fetch-depth: 0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version-file: 'create-jira/package.json'
    - run: |
        cd verify-changed-files
        npm ci
        npm run build
        cd ../create-jira
        npm ci
        npm run build
        cd ../comment-jira
        npm ci
        npm run build
    - name: Commit dist
      uses: ./commit-changes
      with:
        token: ${{ steps.app-token.outputs.token }}
        message: "chore: update dist folders"
        paths: verify-changed-files/dist create-jira/dist comment-jira/dist
