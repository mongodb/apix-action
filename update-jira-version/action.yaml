name: 'Update Jira Version'
description: 'Update a Jira project version (fix version): rename, set the release date, and/or mark it released.'
inputs:
  token:
    description: "Token to connect to Jira"
    required: true
  project-key:
    description: "Project key that owns the version"
    required: true
  name:
    description: "Current version name used to locate the version"
    required: true
  new-name:
    description: "New version name (rename)"
  release-date:
    description: "Release date in YYYY-MM-DD"
  released:
    description: "'true' or 'false'"
  api-base:
    description: "Base URL for the Jira API"
    default: "https://jira.mongodb.org"
outputs:
  version-id:
    description: "Id of the updated version"
    value: ${{ steps.update.outputs.VERSION_ID }}
runs:
  using: "composite"
  steps:
    - id: update
      shell: bash
      env:
        JIRA_API_BASE: ${{ inputs.api-base }}
        JIRA_API_TOKEN: ${{ inputs.token }}
        PROJECT_KEY: ${{ inputs.project-key }}
        NAME: ${{ inputs.name }}
        NEW_NAME: ${{ inputs.new-name }}
        RELEASE_DATE: ${{ inputs.release-date }}
        RELEASED: ${{ inputs.released }}
      run: |
        set -Eeou pipefail

        auth=(
          --header 'Authorization: Bearer '"${JIRA_API_TOKEN}"
          --header 'Accept: application/json'
        )

        VERSION_ID=$(curl --fail --silent \
          --url "${JIRA_API_BASE}/rest/api/2/project/${PROJECT_KEY}/versions" \
          "${auth[@]}" \
          | jq -r --arg name "${NAME}" '.[] | select(.name == $name) | .id' | head -n 1)

        if [[ -z "${VERSION_ID}" ]]; then
          echo "version '${NAME}' not found in project '${PROJECT_KEY}'" >&2
          exit 1
        fi

        payload='{}'
        if [[ -n "${NEW_NAME}" ]]; then
          payload=$(echo "$payload" | jq --arg v "${NEW_NAME}" '.name=$v')
        fi
        if [[ -n "${RELEASE_DATE}" ]]; then
          payload=$(echo "$payload" | jq --arg v "${RELEASE_DATE}" '.releaseDate=$v')
        fi
        if [[ -n "${RELEASED}" ]]; then
          payload=$(echo "$payload" | jq --argjson v "${RELEASED}" '.released=$v')
        fi

        curl --fail --silent --request PUT \
          --url "${JIRA_API_BASE}/rest/api/2/version/${VERSION_ID}" \
          "${auth[@]}" \
          --header 'Content-Type: application/json' \
          --data "$payload"

        echo "VERSION_ID=${VERSION_ID}" >> "$GITHUB_OUTPUT"
