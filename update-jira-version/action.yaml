name: 'Update Jira Version'
description: 'Update a Jira project version (fix version) by id: rename, set the release date, and/or mark it released.'
inputs:
  token:
    description: "Token to connect to Jira"
    required: true
  version-id:
    description: "Id of the version to update"
    required: true
  new-name:
    description: "New version name (rename)"
  release-date:
    description: "Release date in YYYY-MM-DD"
  released:
    description: "'true' or 'false'"
  api-base:
    description: "Base URL for the Jira API"
    default: "https://jira.mongodb.org"
outputs:
  version-id:
    description: "Id of the updated version"
    value: ${{ inputs.version-id }}
runs:
  using: "composite"
  steps:
    - id: update
      shell: bash
      env:
        JIRA_API_BASE: ${{ inputs.api-base }}
        JIRA_API_TOKEN: ${{ inputs.token }}
        VERSION_ID: ${{ inputs.version-id }}
        NEW_NAME: ${{ inputs.new-name }}
        RELEASE_DATE: ${{ inputs.release-date }}
        RELEASED: ${{ inputs.released }}
      run: |
        set -Eeou pipefail
        payload='{}'
        if [[ -n "${NEW_NAME}" ]]; then
          payload=$(echo "$payload" | jq --arg v "${NEW_NAME}" '.name=$v')
        fi
        if [[ -n "${RELEASE_DATE}" ]]; then
          payload=$(echo "$payload" | jq --arg v "${RELEASE_DATE}" '.releaseDate=$v')
        fi
        if [[ -n "${RELEASED}" ]]; then
          payload=$(echo "$payload" | jq --argjson v "${RELEASED}" '.released=$v')
        fi
        curl --fail --silent --show-error \
          --request PUT \
          --url "${JIRA_API_BASE}/rest/api/2/version/${VERSION_ID}" \
          --header 'Authorization: Bearer '"${JIRA_API_TOKEN}" \
          --header 'Accept: application/json' \
          --header 'Content-Type: application/json' \
          --data "$payload" > /dev/null
